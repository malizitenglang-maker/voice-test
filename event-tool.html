<style>

@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--bd:#444;--ac:#4c9bff;--ok:#4fd37d;--ng:#ff6b5e}}
*{box-sizing:border-box}
body{margin:0;padding:10px max(10px,env(safe-area-inset-right)) 40px max(10px,env(safe-area-inset-left));background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif}

#heard,#err{font-size:14px;color:var(--mut);word-break:break-all}#err{color:var(--ng)}
#lst,#cur{font-size:17px;margin:6px 0}
.row{display:flex;gap:6px}.row>button{flex:1}
button{min-height:52px;font-size:18px;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:10px;margin:3px 0}
select{width:100%;min-height:52px;font-size:18px;border:1px solid var(--ac);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 8px}
input[type=text],textarea{width:100%;min-height:44px;font-size:16px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:3px 4px;text-align:left}
details{margin:10px 0}
#tbl details{margin:4px 0;border:1px solid var(--bd);border-radius:8px;padding:6px 8px}#tbl summary{font-size:15px}#tbl .sub{font-size:14px;color:var(--mut);margin-top:4px}
#ov{position:fixed;inset:0;z-index:9;background:var(--ac);color:#fff;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#ov[hidden]{display:none}
</style></head><body>

const KD={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function parsePt(text){
 let s=(text||'').normalize('NFKC').replace(/[,\s]|ポイント|pt|点/gi,'').replace(/[〇零一二三四五六七八九]/g,c=>KD[c]);
 if(!s||/[^\d万千百十]/.test(s))return null;
 const small=t=>{let n=0;for(const [u,m] of [['千',1000],['百',100],['十',10]]){const i=t.indexOf(u);if(i>=0){const d=t.slice(0,i);n+=(d===''?1:+d)*m;t=t.slice(i+1)}}return t===''?n:(/^\d+$/.test(t)?n+ +t:NaN)};
 let v;const i=s.indexOf('万');
 if(i>=0){const a=s.slice(0,i),b=s.slice(i+1);v=(a===''?1:small(a))*10000+(b===''?0:small(b))}else v=small(s);
 return Number.isFinite(v)&&v>=0&&v<10000000?v:null}
const NW={'いち':1,'1':1,'ワン':1,'に':2,'2':2,'ツー':2,'さん':3,'3':3,'スリー':3,'よん':4,'し':4,'4':4,'フォー':4,'ご':5,'5':5,'ファイブ':5};
function pickNum(al){for(const a of al){let t=a.normalize('NFKC').replace(/\s/g,'').replace(/(ばんめ|ばん|番目|番|目)$/,'').replace(/[一二三四五]/g,c=>'一二三四五'.indexOf(c)+1);
 const h=norm(t);for(const k in NW)if(norm(k)===h)return NW[k];if(/^[1-5]$/.test(t))return +t}return null}
const YES=/^(はい|ハイ|yes|うん|ええ|そう|オッケー|ok)/i,NO=/(違|ちが|チガ|いいえ|イイエ|ノー|だめ|ダメ)/i,NEXT=/(次|つぎ|ツギ|ネクスト|next)/i,UNDO=/(取り消|取消|とりけし|トリケシ|消して|けして)/i;
function kind(al,allow){for(const a of al){const s=a.replace(/\s/g,'');if(s.length>8)continue;
 if(allow.includes('undo')&&UNDO.test(s))return 'undo';if(allow.includes('no')&&NO.test(s))return 'no';
 if(allow.includes('next')&&NEXT.test(s))return 'next';if(allow.includes('yes')&&YES.test(s))return 'yes'}return null}
</script>

<script id="ui">
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const CAUSE={'not-allowed':'マイクまたは音声認識が許可されていません（Safariのマイク設定、iOSの音声入力/Siri、HTTPS、ボタン操作以外からの開始の可能性）。',
'service-not-allowed':'音声認識サービスが許可されていません。','audio-capture':'マイクを取得できません。','network':'音声認識サービスに接続できません。','unsupported':'音声認識APIがありません。'};
const errText=e=>`${e.name||'Error'}${e.message?'（'+e.message+'）':''}：${CAUSE[e.name]||''}`;
let st={sets:{},n:1},ph='search',cands=[],page=0,pick=null,lname='',note='',tok=0,silent=0,curRec=null,actx=null,started=false;
try{const j=JSON.parse(localStorage.getItem('ev2')||'null');if(j&&j.sets&&j.n)st=j}catch(e){}
const save=()=>{try{localStorage.setItem('ev2',JSON.stringify(st))}catch(e){}};
const cur=()=>st.sets[st.n]||(st.sets[st.n]=[]);
const isDone=s=>!!s&&s.length>=4&&s.every(x=>x.p!=null);
{const c=cur();if(c.length&&c[c.length-1].p==null)ph='points'}
const used=()=>new Set(Object.values(st.sets).flat().map(x=>x.i));
const stat=songs=>{const pts=songs.reduce((a,x)=>a+(x.p||0),0),sec=songs.reduce((a,x)=>a+S[x.i].s,0);return{pts,sec,eff:pts/(sec/60)}};
const fmt=s=>Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const msg=t=>{$('msg').textContent=t};
const langOf=s=>/[\u3040-\u30ff\u4e00-\u9fff]/.test(s)?'ja-JP':/[àâçéèêëîïôùûüÿœæ]/i.test(s)?'fr-FR':'en-US';
function speak(text,lang){return new Promise((res,rej)=>{
 if(!window.speechSynthesis)return rej(new Error('speechSynthesis非対応'));
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||langOf(text);
 const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')===u.lang);if(v)u.voice=v;
 const to=setTimeout(()=>rej(new Error('読み上げが終了しません')),20000);
 u.onend=()=>{clearTimeout(to);res()};u.onerror=e=>{clearTimeout(to);rej(new Error('TTS: '+(e.error||'不明')))};
 speechSynthesis.speak(u)})}
function beep(){if(!$('beep').checked)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);g.gain.value=.15;o.frequency.value=880;o.start();o.stop(actx.currentTime+.12)}catch(e){}}
function listen(onI){return new Promise((resolve,reject)=>{
 if(!SR)return reject({name:'unsupported'});
 const r=new SR();curRec=r;r.lang='ja-JP';r.interimResults=true;r.maxAlternatives=5;r.continuous=false;let done=false;
 const fin=(v,err)=>{if(done)return;done=true;clearTimeout(t);try{r.abort()}catch(e){}err?reject(err):resolve(v)};
 const t=setTimeout(()=>fin(null,{name:'timeout'}),10000);
 r.onresult=e=>{const x=e.results[e.results.length-1];const a=[...x].map(y=>y.transcript);onI&&onI(a[0]);if(x.isFinal)fin(a)};
 r.onerror=e=>fin(null,{name:e.error,message:e.message});r.onend=()=>fin(null,{name:'no-result'});
 try{r.start()}catch(e){fin(null,{name:e.name,message:e.message})}})}

const MSG={search:'曲名かユニット名を',list:'番号を言う（次／違う）',confirm:'はい／違う',points:'ポイントを'};
async function step(skip){
 const my=++tok;$('ov').hidden=true;
 try{
  if(!skip){
   if(ph==='search'){msg(note||MSG.search);await speak(note||'どうぞ','ja-JP');note=''}
   else if(ph==='list')await readPage(my);
   else if(ph==='confirm'){msg(pick.t+' ですか？');await speak(pick.t);if(my!==tok)return;await speak('ですか？','ja-JP')}
   else if(ph==='points'){msg('ポイントを');await speak('ポイント','ja-JP')}
   if(my!==tok)return}
  msg(ph==='confirm'?pick.t+'（はい／違う）':MSG[ph]);beep();
  const al=await listen(t=>{$('heard').textContent='認識中: '+t});
  if(my!==tok)return;silent=0;$('err').textContent='';$('heard').textContent='認識: '+al.join(' / ');handle(al)
 }catch(e){if(my!==tok)return;
  if(['no-speech','timeout','no-result','aborted'].includes(e.name)&&++silent<=5)return step(true);
  silent=0;$('err').textContent=errText(e);$('ov').textContent='画面をタップして再開';$('ov').hidden=false}}
async function readPage(my){
 const a=cands.slice(page*5,page*5+5);$('lst').innerHTML=a.map((s,k)=>`${k+1}番 ${esc(s.t)}`).join('<br>');msg(lname+'（'+cands.length+'曲）');
 if(page===0)await speak(lname+'、'+cands.length+'曲','ja-JP');
 for(let k=0;k<a.length;k++){if(my!==tok)return;await speak((k+1)+'番','ja-JP');if(my!==tok)return;await speak(a[k].t)}}
function handle(al){
 if(kind(al,['undo'])==='undo')return undo();
 if(ph==='search'){const sn=setCmd(al);if(sn)return goSet(sn);
  if(cur().length>=4){note='4曲そろっています、取り消しで直せます';return step()}
  let r=null;for(const a of al){r=find(a,used());if(r)break}
  if(!r){note='見つかりません、もう一度';return step()}
  if(!r.list.length){note='その曲は使い切りました、もう一度';return step()}
  if(r.list.length===1){pick=r.list[0];ph='confirm'}else{cands=r.list;page=0;lname=r.type==='unit'?r.name:'候補';ph='list';$('lst').innerHTML=''}
  return step()}
 if(ph==='confirm'){const x=kind(al,['yes','no']);if(x==='yes')return rec(pick);
  if(x==='no'){ph='search';note='もう一度';return step()}return step(true)}
 if(ph==='list'){const x=kind(al,['no','next']);
  if(x==='no'){ph='search';note='もう一度';$('lst').innerHTML='';return step()}
  if(x==='next'){page=(page+1)*5>=cands.length?0:page+1;return step()}
  const n=pickNum(al),s=n&&cands[page*5+n-1];if(s)return rec(s);return step(true)}
 if(ph==='points'){let n=null;for(const a of al){n=parsePt(a);if(n!=null)break}
  if(n==null){msg('数字で言ってください');return step(true)}return setPts(n)}}
function rec(s){cur().push({i:s.i,p:null});save();$('lst').innerHTML='';ph='points';render();step()}
async function setPts(n){const my=++tok,c=cur();c[c.length-1].p=n;save();render();
 try{await speak(n+'ポイント','ja-JP')}catch(e){}
 if(my!==tok)return;if(c.length>=4)return finish();ph='search';note='';step()}
async function finish(){const my=++tok,no=st.n,x=stat(cur());
 const all=Object.values(st.sets).filter(isDone).map(s=>stat(s).eff);const best=all.length>1&&all.every(e=>e<=x.eff);
 let nx=0;for(let k=1;k<=30&&!nx;k++){const m=(no+k-1)%30+1;if((st.sets[m]||[]).length<4)nx=m}
 if(nx)st.n=nx;save();render();ph='search';note='';
 try{await speak(`セット${no}、合計${x.pts}ポイント、${Math.floor(x.sec/60)}分${x.sec%60}秒、毎分${Math.round(x.eff)}ポイント${best?'、今のところ最高':''}。`+(nx?`次はセット${nx}`:'30セットそろいました'),'ja-JP')}catch(e){}
 if(my===tok)step()}
function halt(){tok++;try{speechSynthesis.cancel()}catch(e){}try{curRec&&curRec.abort()}catch(e){}}
function setCmd(al){for(const a of al){const s=a.normalize('NFKC').replace(/\s/g,'');if(s.length>9)continue;
 const m=s.match(/セット([0-9一二三四五六七八九十]+)/)||s.match(/([0-9一二三四五六七八九十]+)セット/);
 if(m){const n=parsePt(m[1]);if(n>=1&&n<=30)return n}}return null}
function goSet(n){halt();st.n=n;save();render();$('lst').innerHTML='';const c=cur();
 ph=c.length&&c[c.length-1].p==null?'points':'search';
 note=ph==='points'?'':c.length>=4?`セット${n}、4曲そろっています`:`セット${n}、${c.length?c.length+'曲':'どうぞ'}`;step()}
function undo(){halt();const x=cur().pop();save();render();$('lst').innerHTML='';ph='search';
 note=x?'取り消しました':'取り消す記録がありません';step()}
function send(t){if(!started)return;halt();handle([t])}
function render(){
 $('hd').textContent=`使用済み ${used().size}/${S.length}曲`;
 const sel=$('sel');sel.innerHTML=Array.from({length:30},(_,k)=>{const m=k+1,s=st.sets[m]||[];
  return`<option value="${m}">セット${m}　${isDone(s)?'✓ 毎分'+stat(s).eff.toFixed(0):s.length?s.length+'/4曲':'空'}</option>`}).join('');sel.value=st.n;
 $('cur').innerHTML=cur().map((x,k)=>`${k+1}. ${esc(S[x.i].t)} … ${x.p==null?'—':x.p+'pt'}`).join('<br>');
 const rows=Object.entries(st.sets).filter(([k,s])=>isDone(s)).map(([k,s])=>({k:+k,s,...stat(s)})).sort((a,b)=>b.eff-a.eff);
 $('tbl').innerHTML=rows.length?rows.map((r,j)=>`<details><summary><b>${j+1}位</b>　セット${r.k}　毎分${r.eff.toFixed(1)}pt${j?'（1位の'+Math.round(r.eff/rows[0].eff*100)+'%）':''}</summary><div class="sub">合計 ${r.pts}pt ／ ${fmt(r.sec)}<br>${r.s.map((x,n)=>`${n+1}. ${esc(S[x.i].t)}（${esc(S[x.i].u)}・${fmt(S[x.i].s)}）${x.p}pt`).join('<br>')}</div></details>`).join(''):'まだありません（4曲そろったセットが並びます）'}
$('ov').onclick=()=>{if(!started){started=true;if(window.speechSynthesis)speechSynthesis.getVoices();return step()}step(true)};
$('bYes').onclick=()=>send('はい');$('bNo').onclick=()=>send('違う');$('bNext').onclick=()=>send('次');$('bUndo').onclick=()=>send('取り消し');
$('bSend').onclick=()=>{const v=$('man').value.trim();if(v){$('man').value='';send(v)}};
$('sel').onchange=()=>goSet(+$('sel').value);$('bPrev').onclick=()=>goSet(Math.max(1,st.n-1));$('bNx').onclick=()=>goSet(Math.min(30,st.n+1));
$('bCsv').onclick=()=>{const L=['セット,曲名,ユニット,pt,秒'];Object.keys(st.sets).map(Number).sort((a,b)=>a-b).forEach(k=>st.sets[k].forEach(x=>L.push([k,'"'+S[x.i].t.replace(/"/g,'""')+'"',S[x.i].u,x.p,S[x.i].s].join(','))));
 $('csv').value=L.join('\n');$('csv').hidden=false};
$('bClr').onclick=()=>{if(confirm('セット'+st.n+'を空にします。よろしいですか？')){halt();st.sets[st.n]=[];save();ph='search';$('lst').innerHTML='';render();note='セット'+st.n+'を空にしました';step()}};
$('bReset').onclick=()=>{if(confirm('全部の記録を消します。よろしいですか？')){halt();st={sets:{},n:1};save();ph='search';$('lst').innerHTML='';render();note='';step()}};
render();
</script></body></html>
